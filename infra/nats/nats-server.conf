# AegisEdge Phase 4.2: Local Development NATS Server Configuration
# Reference: ADR-0006 (NATS Event-Driven Messaging Architecture)

server_name: "aegisedge-nats-dev"

# Client connections (Standard NATS TCP port)
port: 4222

# HTTP Monitoring and Healthcheck endpoint
# Provides /varz, /connz, /routez, /subsz, /jsz, /healthz
http_port: 8222

# JetStream durable streaming and persistence configuration
jetstream {
    # Directory where JetStream streams and consumer state are stored
    store_dir: "/data/jetstream"

    # Finite resource boundaries for local development
    max_mem: 512MB
    max_file: 2GB
}
