# Prometheus Server Configuration for AegisEdge (Docker Deployment)
# Reference: docs/development/telemetry-quarantine.md
#
# Networking Note:
# In Docker environments (Docker Desktop on Windows/macOS or Linux with host-gateway),
# 'host.docker.internal:8080' targets the host machine where the AegisEdge control-plane runs.
# For host-native Prometheus execution, use prometheus.yml targeting '127.0.0.1:8080'.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "aegisedge-control-plane"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]
