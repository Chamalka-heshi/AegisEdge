# AegisEdge Grafana Dashboard Provider Configuration
# Reference: ADR-0008, docs/development/telemetry-quarantine.md

apiVersion: 1

providers:
  - name: 'AegisEdge'
    orgId: 1
    folder: 'AegisEdge'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
