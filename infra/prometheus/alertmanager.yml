# Alertmanager Production Configuration for AegisEdge
# Reference: ADR-0008, docs/development/telemetry-quarantine.md

global:
  resolve_timeout: 5m

route:
  receiver: "local-development-sink"
  group_by: ["alertname", "severity", "job", "instance"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - receiver: "local-development-sink"
      matchers:
        - severity = "critical"
      repeat_interval: 1h

    - receiver: "local-development-sink"
      matchers:
        - severity = "warning"
      repeat_interval: 4h

receivers:
  # Local sink with no outbound integrations: evaluates & groups alerts in memory with 0 network errors
  - name: "local-development-sink"

inhibit_rules:
  # Inhibit Quarantine Warning when corresponding Quarantine Critical is active on the same instance
  - target_matchers:
      - alertname = "QuarantineActiveBacklogHigh"
      - severity = "warning"
    source_matchers:
      - alertname = "QuarantineActiveBacklogCritical"
      - severity = "critical"
    equal: ["job", "instance"]

  # Inhibit NATS Pending Recovery Warning when corresponding NATS Recovery Critical is active on the same instance
  - target_matchers:
      - alertname = "NATSPendingRecoveryAccumulationWarning"
      - severity = "warning"
    source_matchers:
      - alertname = "NATSPendingRecoveryAccumulationCritical"
      - severity = "critical"
    equal: ["job", "instance"]
