# Prometheus Server Configuration for AegisEdge Lifecycle Integration Testing
# Reference: docs/development/telemetry-quarantine.md
# Note: Used strictly by automated integration test runner (scripts/test-alertmanager-lifecycle.ps1).

global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - "alert_rules.yml"
  - "alert_rules_lifecycle_test.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "aegisedge-control-plane"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "aegisedge-lifecycle-test"
    metrics_path: "/test-metrics"
    scrape_interval: 2s
    static_configs:
      - targets: ["webhook-receiver:9095"]
