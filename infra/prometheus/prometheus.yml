# Prometheus Server Configuration for AegisEdge
# Reference: docs/development/telemetry-quarantine.md

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "aegisedge-control-plane"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:8080"]
