# Prometheus Server Configuration for AegisEdge
# Reference: docs/development/telemetry-quarantine.md
#
# Deployment & Topology Guidance:
# - '127.0.0.1:8080' is appropriate when Prometheus executes directly on the host alongside the control plane.
# - If Prometheus runs inside a Docker container, '127.0.0.1' points to the container's isolated network.
#   In that setup, use 'host.docker.internal:8080' (Docker Desktop) or a service DNS name on a shared Docker network.
# - Note: The repository currently does not establish a combined Prometheus + control-plane Docker Compose deployment.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: "aegisedge-control-plane"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:8080"]

  - job_name: "aegisedge-alertmanager"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:9093"]

  - job_name: "aegisedge-prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:9090"]
